<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta
      name="description"
      content="TaskFlow is a real-time project management app: Kanban boards, live collaboration, activity logs and notifications for modern teams."
    />
    <meta name="theme-color" content="#ffffff" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
    />
    <!-- Applies the saved / system colour theme before first paint (external file: CSP friendly). -->
    <script src="/theme-init.js"></script>
    <!-- Boot splash shown until React renders; mirrors src/components/layout/SplashScreen.jsx. -->
    <style>
      html {
        background: rgb(246 247 251);
      }
      html.dark {
        background: rgb(11 14 22);
      }
      .boot-splash {
        display: flex;
        min-height: 100vh;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1.5rem;
        padding: 0 1rem;
        color: rgb(91 100 122);
        font: 400 0.875rem/1.25rem Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
      }
      .dark .boot-splash {
        color: rgb(154 163 184);
      }
      .boot-splash__mark {
        position: relative;
      }
      .boot-splash__glow {
        position: absolute;
        inset: -1rem;
        border-radius: 28px;
        background: rgb(99 102 241 / 0.2);
        filter: blur(24px);
        animation: boot-pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
      }
      .boot-splash__tile {
        position: relative;
        display: flex;
        height: 3.5rem;
        width: 3.5rem;
        align-items: center;
        justify-content: center;
        border-radius: 1rem;
        background: linear-gradient(to bottom right, #6366f1, #7c3aed);
        box-shadow:
          inset 0 0 0 1px rgb(255 255 255 / 0.1),
          0 10px 15px -3px rgb(79 70 229 / 0.3),
          0 4px 6px -4px rgb(79 70 229 / 0.3);
      }
      .boot-splash__status {
        display: flex;
        align-items: center;
        gap: 0.625rem;
      }
      .boot-splash__spinner {
        height: 1rem;
        width: 1rem;
        color: #6366f1;
        animation: boot-spin 1s linear infinite;
      }
      @keyframes boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
      @keyframes boot-pulse {
        50% {
          opacity: 0.5;
        }
      }
    </style>
    <noscript>
      <style>
        .boot-splash {
          display: none;
        }
      </style>
    </noscript>
    <title>TaskFlow — Real-time project management</title>
  </head>
  <body>
    <noscript>TaskFlow needs JavaScript enabled to run.</noscript>
    <div id="root">
      <div class="boot-splash" role="status" aria-live="polite">
        <div class="boot-splash__mark" aria-hidden="true">
          <span class="boot-splash__glow"></span>
          <span class="boot-splash__tile">
            <svg
              width="28"
              height="28"
              viewBox="0 0 24 24"
              fill="none"
              stroke="#fff"
              stroke-width="2.25"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <rect width="18" height="18" x="3" y="3" rx="2" />
              <path d="M8 7v7M12 7v4M16 7v9" />
            </svg>
          </span>
        </div>
        <div class="boot-splash__status">
          <svg class="boot-splash__spinner" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <circle cx="12" cy="12" r="9.5" stroke="currentColor" stroke-width="2.5" opacity="0.2" />
            <path
              d="M21.5 12A9.5 9.5 0 0 0 12 2.5"
              stroke="currentColor"
              stroke-width="2.5"
              stroke-linecap="round"
            />
          </svg>
          <span>Loading TaskFlow…</span>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
